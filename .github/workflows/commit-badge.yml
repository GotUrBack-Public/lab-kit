name: Update short commit badge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-badge
  cancel-in-progress: true

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Generate and publish SVG badge
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 "$TARGET_SHA")"
          SVG="<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"112\" height=\"20\" role=\"img\" aria-label=\"commit: $SHORT_SHA\"><title>commit: $SHORT_SHA</title><linearGradient id=\"b\" x2=\"0\" y2=\"100%\"><stop offset=\"0\" stop-color=\"#bbb\" stop-opacity=\".1\"/><stop offset=\"1\" stop-opacity=\".1\"/></linearGradient><clipPath id=\"r\"><rect width=\"112\" height=\"20\" rx=\"3\" fill=\"#fff\"/></clipPath><g clip-path=\"url(#r)\"><path fill=\"#555\" d=\"M0 0h48v20H0z\"/><path fill=\"#007ec6\" d=\"M48 0h64v20H48z\"/><path fill=\"url(#b)\" d=\"M0 0h112v20H0z\"/></g><g fill=\"#fff\" text-anchor=\"middle\" font-family=\"Verdana,Geneva,sans-serif\" font-size=\"11\"><text x=\"24\" y=\"14\">commit</text><text x=\"80\" y=\"14\">$SHORT_SHA</text></g></svg>"

          git fetch origin badges
          git checkout -B badges FETCH_HEAD
          printf '%s\n' "$SVG" > commit.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commit.svg
          if git diff --cached --quiet; then
            echo "Commit badge is already up to date."
          else
            git commit -m "chore: update short commit badge to $SHORT_SHA"
            git push origin HEAD:badges
          fi
